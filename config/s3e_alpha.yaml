liorf:
  # Topics
  pointCloudTopic: "/Alpha/velodyne_points"
  imuTopic: "/Alpha/imu/data"
  odomTopic: "odometry/imu"
  gpsTopic: "/Alpha/fix"

  # Frames
  lidarFrame: "velodyne"
  baselinkFrame: "imu_link"
  odometryFrame: "odom"
  mapFrame: "map"

  # GPS settings
  useImuHeadingInitialization: false
  useGpsElevation: false
  gpsCovThreshold: 2.0
  poseCovThreshold: 25.0

  # Sensor settings
  sensor: velodyne
  N_SCAN: 16
  Horizon_SCAN: 1800
  downsampleRate: 1
  point_filter_num: 1
  lidarMinRange: 1.0
  lidarMaxRange: 200.0

  # IMU settings (from S3E Alpha calibration)
  imuType: 0
  imuRate: 100.0
  imuAccNoise: 1.0919628856399554e-02
  imuGyrNoise: 1.0451440924866223e-02
  imuAccBiasN: 2.1851827629113259e-04
  imuGyrBiasN: 8.1770009351257180e-05
  imuGravity: 9.81
  imuRPYWeight: 0.01

  # Rotation mapping IMU vectors into lidar frame (R_l_i).
  extrinsicRot: [0.999952964977, -0.009686314531, 0.000484956926,
                 0.009666234272, 0.99945700854, 0.031500090631,
                 -0.000789816284, -0.031493925689, 0.999503627418]
  extrinsicRPY: [0.999952964977, -0.009686314531, 0.000484956926,
                 0.009666234272, 0.99945700854, 0.031500090631,
                 -0.000789816284, -0.031493925689, 0.999503627418]
  # Translation from lidar frame to imu frame (t_l_i).
  extrinsicTrans: [0.010326832848, -0.044260583546, 0.13948061773]

  # Mapping settings
  mappingSurfLeafSize: 0.4
  surroundingKeyframeMapLeafSize: 0.5
  loopClosureICPSurfLeafSize: 0.5
  mappingProcessInterval: 0.0
  surroundingkeyframeAddingDistThreshold: 0.3   # meters, keyframe insertion gate
  surroundingkeyframeAddingAngleThreshold: 0.1  # radians, keyframe insertion gate
  loopClosureEnableFlag: false

  # CBS/BPSAM bridge settings
  cbsAgentId: "l"
  cbsEnableGkcm: true
  cbsEnableBeliefDcs: false
  cbsBeliefSimilarityThreshold: 0.01
  cbsBeliefBridgeEnable: true
  cbsExternalExchangeInBodyFrame: true
  cbsBeliefExchangeWindowSize: 30
  cbsBeliefTimestampToleranceSec: 0.12
  cbsBeliefInTopic: "/kimera/cbs/belief_out"
  cbsBeliefOutTopic: "/kimera/cbs/belief_in"
